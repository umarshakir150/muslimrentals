name: CI

# Additive CI only: lint, type-check, build, and test the existing
# suites on every push/PR touching each package. Does not touch
# production -- no deploy step, no Netlify/Render interaction, and no
# Prisma migration is ever run against a real database (backend tests
# are DB-independent by design, see backend/vitest.config.ts).
on:
  push:
    branches: [main]
  pull_request:

# Cancel an in-progress run for the same branch/PR when a new commit
# lands, so pushes don't queue up redundant runs of a stale commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, build, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rentals/backend
    # A syntactically valid but unreachable DATABASE_URL -- `prisma generate`
    # only reads the schema to emit the client, it never connects, and the
    # test suite itself never touches a real database (see vitest.config.ts).
    # JWT secrets are 32+ chars to satisfy validateEnv.ts if it's ever
    # exercised at import time.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_placeholder
      JWT_SECRET: ci-only-placeholder-access-secret-32-chars-min
      JWT_REFRESH_SECRET: ci-only-placeholder-refresh-secret-32-chars-min
      FRONTEND_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rentals/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (tsc)
        run: npm run build

      - name: Test
        run: npm test

  frontend:
    name: Frontend (lint, type-check, build, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rentals/frontend
    env:
      # Placeholder values so next build doesn't fail on a missing env var
      # -- no real backend/socket server is contacted during a static build.
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_SOCKET_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rentals/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Test
        run: npm test

      - name: Build (next build)
        run: npm run build
